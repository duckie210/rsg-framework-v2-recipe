$engine: 3
$onesync: on
name: RSG Framework v2 (pinned 2.x)
version: 1.0.0
author: Rexshack Gaming
description: RSG RedM Server Build - last 2.x state before the v3 move, every resource pinned to a commit

tasks:
  #  Download Base Files
  - action: download_github
    src: https://github.com/duckie210/rsg-framework-v2-recipe
    ref: main
    dest: ./tmp/RSGCore

  - action: move_path
    src: ./tmp/RSGCore/server.cfg
    dest: ./server.cfg

  - action: move_path
    src: ./tmp/RSGCore/myLogo.png
    dest: ./myLogo.png

  # Prepare Database
  - action: connect_database
  - action: query_database
    file: ./tmp/RSGCore/rsgcore.sql

  # Downloading Standalone Resources  
